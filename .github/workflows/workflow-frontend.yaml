name: Frontend CI/CD Pipeline

on:
  push:
    branches: ['dev']

jobs:
  # ---------------------------------------------------
  # JOB 1: O "Guarda-Costas" (Lint e Tipagem)
  # ---------------------------------------------------
  teste-codigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci 

      - name: Run Lint
        run: npm run lint

      - name: Test Build (Verificação de Tipos)
        run: npm run build

  # ---------------------------------------------------
  # JOB 2: O "Entregador" (Deploy na Vercel)
  # ---------------------------------------------------
  deploy-vercel:
    runs-on: ubuntu-latest
    needs: teste-codigo
    steps:
      - name: Avisar a Vercel para fazer o Deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -X POST $VERCEL_DEPLOY_HOOK